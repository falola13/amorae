name: Nightly backup

# A full copy of the production database every night, kept 30 days.
#
# The repository is public, and so are its workflow artifacts to any signed-in
# GitHub user — so the dump is encrypted before it is uploaded, and the
# plaintext never leaves the runner. Without BACKUP_PASSPHRASE the artifacts
# are unreadable, including to us: keep it in a password manager.
#
# Restoring is in docs/DEPLOYMENT.md, "Backups".

on:
  schedule:
    # 02:17 UTC, 03:17 in Lagos: off the hour, when nobody is using the app.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets are set
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set BACKUP_DATABASE_URL and BACKUP_PASSPHRASE in the repository's Actions secrets."
            exit 1
          fi

      - name: Dump
        # The client matches the newest server we run; pg_dump reads older
        # servers fine. Custom format: compressed, and pg_restore can pick
        # single tables out of it.
        run: |
          docker run --rm -e BACKUP_DATABASE_URL -v "$PWD:/out" postgres:18-alpine \
            sh -c 'pg_dump --no-owner --no-acl -Fc -f /out/amorae.dump "$BACKUP_DATABASE_URL"'

      - name: Check it reads back
        # A dump that pg_restore can't list is not a backup.
        run: |
          docker run --rm -v "$PWD:/out" postgres:18-alpine pg_restore --list /out/amorae.dump > contents.txt
          tables=$(grep -c " TABLE DATA " contents.txt || true)
          size=$(stat -c %s amorae.dump)
          echo "Dump: $size bytes, $tables tables with data."
          if [ "$tables" -lt 10 ]; then
            echo "::error::Only $tables tables with data in the dump — something is wrong."
            exit 1
          fi

      - name: Encrypt
        id: encrypt
        run: |
          name="amorae-$(date -u +%Y-%m-%d)"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            -o "$name.dump.gpg" amorae.dump
          shred -u amorae.dump contents.txt
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Keep
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.encrypt.outputs.name }}
          path: ${{ steps.encrypt.outputs.name }}.dump.gpg
          retention-days: 30
          if-no-files-found: error
          # Already compressed and encrypted; zipping again gains nothing.
          compression-level: 0
