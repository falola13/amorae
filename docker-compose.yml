# Full local stack: Postgres → one-shot migrations → API → web.
#
#   docker compose up --build        # everything, on http://localhost:3000
#   docker compose up -d db          # just the database, for running the apps natively
#
# Postgres is published on 5434 (override with AMORAE_DB_PORT), not 5432, so it
# can sit alongside other Postgres instances already running on the host.
#
# Every published port binds to 127.0.0.1: reachable from this machine, not
# from anyone else on the same Wi-Fi. Without that, the database (with its
# well-known dev password) is open to the whole local network.
name: amorae

# Shared by api and web. A dev-only value: use a real random secret
# (e.g. `openssl rand -hex 32`) anywhere that isn't your laptop.
x-bff-secret: &bff-secret dev-only-bff-secret-0123456789abcdef

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: amorae
      POSTGRES_PASSWORD: amorae
      POSTGRES_DB: amorae
    ports:
      - "127.0.0.1:${AMORAE_DB_PORT:-5434}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so the
      # volume mounts the parent rather than the pre-18 .../data path.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amorae -d amorae"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Migrations run as their own step, once, before any API replica starts.
  # Running them inside the API process would race when the API is scaled out.
  migrate:
    build: ./apps/api
    command: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://amorae:amorae@db:5432/amorae?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./apps/api
    environment:
      # Development unless told otherwise. This said `production`, which made
      # `docker compose up` crash-loop on a clean checkout: config refuses to
      # start in production without RESEND_API_KEY, MAIL_FROM and APP_URL, and
      # none of them were passed. Set APP_ENV=production in .env when you mean
      # it, supply those three, and the same file is the deployment
      # (docs/DEPLOYMENT.md).
      APP_ENV: ${APP_ENV:-development}
      APP_URL: ${APP_URL:-http://localhost:3000}
      HTTP_ADDR: ":8088"
      DATABASE_URL: postgres://amorae:amorae@db:5432/amorae?sslmode=disable
      LOG_LEVEL: info
      # Inside the container network only; deliberately not published.
      METRICS_ADDR: ":9090"
      BFF_SECRET: *bff-secret
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Set only where there is nowhere to run the worker, and something
      # external calls POST /internal/tick instead. Empty means no endpoint.
      TICK_SECRET: ${TICK_SECRET:-}
      # All three or none. Empty means memory photos are unavailable, which
      # the app handles rather than refusing to start.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The runtime image is distroless (no shell, no curl), so the binary
      # checks itself.
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Sends what nobody opens the app to ask for: that it is your week, and that
  # you have prayers left today. Same image as the API, different command.
  worker:
    build: ./apps/api
    command: ["/app/worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgres://amorae:amorae@db:5432/amorae?sslmode=disable
      LOG_LEVEL: info
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Without these it decides everything and logs what it would have sent,
      # which is what you want locally. Real keys belong in a secret store.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      BFF_SECRET: *bff-secret
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      # Baked into the bundle, not read at runtime — see the note in the
      # Dockerfile. Set VAPID_PUBLIC_KEY in the environment before building,
      # or the deployed app can never subscribe anybody to push.
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    environment:
      API_URL: http://api:8088
      # Served over plain http on localhost here; set true behind TLS.
      COOKIE_SECURE: "false"
      BFF_SECRET: *bff-secret
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
